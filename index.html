<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2fb">
  <title>よふすたタイムスタンプ検索</title>
  <style>
    :root { color-scheme: light; --ink:#292536; --muted:#777184; --accent:#8064ad; --line:#e9e4f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f5fa; color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    main { width:min(900px, calc(100% - 32px)); margin:0 auto; padding:42px 0 72px; }
    h1 { margin:0 0 8px; font-size:clamp(23px,5vw,32px); letter-spacing:.02em; }
    .lead { margin:0 0 24px; color:var(--muted); font-size:14px; }
    .search-wrap { position:sticky; top:0; z-index:2; padding:12px 0; background:#f7f5faeF; backdrop-filter:blur(10px); }
    #search { width:100%; border:1px solid #dcd4e8; border-radius:14px; padding:16px 17px; font:inherit; font-size:16px; outline:none; background:white; box-shadow:0 3px 14px #34244b0a; }
    #search:focus { border-color:var(--accent); box-shadow:0 0 0 3px #8064ad20; }
    #status { color:var(--muted); font-size:13px; margin:12px 2px 16px; }
    .episode { background:white; border:1px solid var(--line); border-radius:16px; margin:0 0 14px; overflow:hidden; box-shadow:0 4px 16px #34244b08; }
    .episode-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:15px 17px; background:#fbfaff; border-bottom:1px solid var(--line); }
    .episode-name { font-weight:700; }
    .episode-link { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; }
    .episode-link:hover,.entry-link:hover { text-decoration:underline; }
    .entry { display:grid; grid-template-columns:76px minmax(0,1fr); gap:12px; padding:13px 17px; border-bottom:1px solid #f0edf4; }
    .entry:last-child { border-bottom:0; }
    .time { color:var(--accent); font-variant-numeric:tabular-nums; font-weight:700; text-decoration:none; white-space:nowrap; }
    .entry-title { line-height:1.65; overflow-wrap:anywhere; }
    .section { display:inline-block; margin:0 7px 4px 0; padding:2px 7px; border-radius:6px; background:#f1edf8; color:#6f5a91; font-size:11px; vertical-align:1px; }
    .empty { padding:30px 18px; text-align:center; color:var(--muted); background:white; border:1px solid var(--line); border-radius:14px; }
    @media(max-width:520px) { main{width:calc(100% - 22px);padding-top:28px}.entry{grid-template-columns:64px minmax(0,1fr);gap:8px;padding:12px}.episode-head{padding:13px}.episode-link{margin-left:0;width:100%} }
  </style>
</head>
<body>
<main>
  <h1>よふすたタイムスタンプ検索</h1>
  <p class="lead">気になる話題やトークを、キーワードから検索できます。</p>
  <div class="search-wrap"><input id="search" type="search" placeholder="例：小松さん、ふつおた、グラボ…" autocomplete="off"></div>
  <div id="status" aria-live="polite">データを読み込んでいます…</div>
  <div id="results"></div>
</main>
<script>
const searchInput = document.getElementById('search');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
let episodes = [];

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function toSeconds(time) {
  return time.split(':').map(Number).reduce((total, part) => total * 60 + part, 0);
}
// タイトル内に続けて書かれた時刻も、独立した検索項目として展開する。
function cleanTitlePart(value, isPrefix = false) {
  let text = String(value || '').trim();
  if (!isPrefix) text = text.replace(/^[\s　]*[〜～~]?\s*/, '');
  text = text.replace(/^[\s　]*[\/／|､，,;；]+[\s　]*/, '');
  text = text.replace(/[\s　]*[\/／|､，,;；]+[\s　]*$/, '').trim();
  if (isPrefix) {
    text = text.replace(/[\s　]*[（(][\s　]*$/, '').trim();
  } else if (/[)）]$/.test(text)) {
    const opens = (text.match(/[（(]/g) || []).length;
    const closes = (text.match(/[）)]/g) || []).length;
    if (closes > opens) text = text.replace(/[）)]\s*$/, '').trim();
  }
  return text;
}
function expandEmbeddedTimestamps(entries) {
  const expanded = [];
  const timestampPattern = /(?:^|[^\d:])((?:\d{1,2}:)?\d{1,2}:\d{2})(?!\d)/g;
  for (const entry of entries || []) {
    const title = String(entry.title || '');
    const matches = [];
    let match;
    while ((match = timestampPattern.exec(title)) !== null) {
      const start = match.index + match[0].length - match[1].length;
      matches.push({ time: match[1], start, end: start + match[1].length });
    }
    if (!matches.length) {
      expanded.push(entry);
      continue;
    }
    const firstTitle = cleanTitlePart(title.slice(0, matches[0].start), true);
    if (firstTitle) expanded.push({ ...entry, title: firstTitle });
    for (let i = 0; i < matches.length; i++) {
      const current = matches[i];
      const nextStart = matches[i + 1]?.start ?? title.length;
      const partTitle = cleanTitlePart(title.slice(current.end, nextStart));
      if (partTitle) expanded.push({ ...entry, time: current.time, title: partTitle });
    }
  }
  return expanded;
}
function youtubeTimeURL(url, time) {
  const clean = new URL(url);
  clean.searchParams.set('t', `${toSeconds(time)}s`);
  return clean.toString();
}
function render() {
  const q = searchInput.value.trim().toLocaleLowerCase();
  const matched = [];
  let total = 0;
  for (const episode of episodes) {
    const entries = (episode.entries || []).filter(entry => {
      const haystack = `${episode.episode} ${entry.section || ''} ${entry.time} ${entry.title}`.toLocaleLowerCase();
      return !q || haystack.includes(q);
    });
    if (entries.length) { matched.push({ ...episode, entries }); total += entries.length; }
  }
  statusEl.textContent = q ? `${total}件のタイムスタンプが見つかりました（${matched.length}エピソード）` : `${episodes.length}エピソード・${episodes.reduce((n,e)=>n+(e.entries||[]).length,0)}件のタイムスタンプを収録`;
  if (!matched.length) {
    resultsEl.innerHTML = '<div class="empty">一致するタイムスタンプがありませんでした。別のキーワードでも試してみてね。</div>';
    return;
  }
  resultsEl.innerHTML = matched.map(ep => `
    <section class="episode">
      <div class="episode-head">
        <span class="episode-name">${escapeHTML(ep.episode)}</span>
        <a class="episode-link" href="${escapeHTML(ep.url)}" target="_blank" rel="noopener noreferrer">動画を開く ↗</a>
      </div>
      ${ep.entries.map(entry => `
        <div class="entry">
          <a class="time" href="${escapeHTML(youtubeTimeURL(ep.url, entry.time))}" target="_blank" rel="noopener noreferrer">${escapeHTML(entry.time)}</a>
          <div class="entry-title">${entry.section ? `<span class="section">${escapeHTML(entry.section)}</span>` : ''}${escapeHTML(entry.title)}</div>
        </div>`).join('')}
    </section>`).join('');
}
searchInput.addEventListener('input', render);
fetch('./data.txt')
  .then(response => { if (!response.ok) throw new Error('data.txtを読み込めませんでした'); return response.json(); })
  .then(data => { episodes = data; render(); })
  .catch(error => { statusEl.textContent = 'データを読み込めませんでした。index.htmlとdata.txtが同じフォルダにあるか確認してください。'; resultsEl.innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`; });
</script>
</body>
</html>
