<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f2fb"><title>よふすたタイムスタンプ検索</title>
<style>
:root{color-scheme:light;--ink:#292536;--muted:#777184;--accent:#8064ad;--line:#e9e4f0}*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:42px 0 72px}h1{margin:0 0 8px;font-size:clamp(23px,5vw,32px)}.lead{margin:0 0 24px;color:var(--muted);font-size:14px}.search-wrap{position:sticky;top:0;z-index:2;padding:12px 0;background:#f7f5faef;backdrop-filter:blur(10px)}#search{width:100%;border:1px solid #dcd4e8;border-radius:14px;padding:16px 17px;font:inherit;font-size:16px;outline:none;background:white;box-shadow:0 3px 14px #34244b0a}#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8064ad20}#status{color:var(--muted);font-size:13px;margin:12px 2px 16px}.episode{background:white;border:1px solid var(--line);border-radius:16px;margin:0 0 14px;overflow:hidden;box-shadow:0 4px 16px #34244b08}.episode-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:15px 17px;background:#fbfaff;border-bottom:1px solid var(--line)}.episode-name{font-weight:700}.episode-link{margin-left:auto;color:var(--accent);font-size:13px;text-decoration:none}.entry{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:13px 17px;border-bottom:1px solid #f0edf4}.entry:last-child{border-bottom:0}.time{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;text-decoration:none;white-space:nowrap}.entry-title{line-height:1.65;overflow-wrap:anywhere}.section{display:inline-block;margin:0 7px 4px 0;padding:2px 7px;border-radius:6px;background:#f1edf8;color:#6f5a91;font-size:11px;vertical-align:1px}.empty{padding:30px 18px;text-align:center;color:var(--muted);background:white;border:1px solid var(--line);border-radius:14px}@media(max-width:520px){main{width:calc(100% - 22px);padding-top:28px}.entry{grid-template-columns:64px minmax(0,1fr);gap:8px;padding:12px}.episode-head{padding:13px}.episode-link{margin-left:0;width:100%}}
</style></head><body><main><h1>よふすたタイムスタンプ検索</h1><p class="lead">エピソードや話題のキーワードからタイムスタンプを探せます。</p><div class="search-wrap"><input id="search" type="search" placeholder="例：小松さん、ふつおた、グラボ…" autocomplete="off"></div><div id="status" aria-live="polite">データを読み込んでいます…</div><div id="results"></div></main>
<script>
const searchInput=document.getElementById('search'),statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');let episodes=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function seconds(t){return t.split(':').map(Number).reduce((a,b)=>a*60+b,0);}
function render(){const q=searchInput.value.trim().toLocaleLowerCase();let total=0;const matched=[];for(const ep of episodes){const entries=(ep.entries||[]).filter(e=>`${ep.episode} ${e.section||''} ${e.time} ${e.title}`.toLocaleLowerCase().includes(q));if(entries.length){matched.push({...ep,entries});total+=entries.length;}}statusEl.textContent=q?`${total}件のタイムスタンプが見つかりました（${matched.length}エピソード）`:`${episodes.length}エピソード・${episodes.reduce((n,e)=>n+(e.entries||[]).length,0)}件のタイムスタンプを収録`;if(!matched.length){resultsEl.innerHTML='<div class="empty">一致するタイムスタンプがありませんでした。別のキーワードでも試してみてね。</div>';return;}resultsEl.innerHTML=matched.map(ep=>`<section class="episode"><div class="episode-head"><span class="episode-name">${esc(ep.episode)}</span>${ep.url?`<a class="episode-link" href="${esc(ep.url)}" target="_blank" rel="noopener noreferrer">動画を開く ↗</a>`:''}</div>${ep.entries.map(e=>`<div class="entry"><a class="time" href="${esc(ep.url?(()=>{const u=new URL(ep.url);u.searchParams.set('t',seconds(e.time)+'s');return u.toString()})():'#')}" target="_blank" rel="noopener noreferrer">${esc(e.time)}</a><div class="entry-title">${e.section?`<span class="section">${esc(e.section)}</span>`:''}${esc(e.title)}</div></div>`).join('')}</section>`).join('');}
searchInput.addEventListener('input',render);fetch('./data.txt').then(r=>{if(!r.ok)throw Error('data.txtを読み込めませんでした');return r.json()}).then(d=>{episodes=d;render()}).catch(e=>{statusEl.textContent='データを読み込めませんでした。index.htmlとdata.txtを同じフォルダに置いてください。';resultsEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script></body></html>
